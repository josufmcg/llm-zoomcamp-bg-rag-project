apiVersion: 1

# Remove any existing PostgreSQL datasource before provisioning,
# so re-provisioning with a new uid is idempotent.
deleteDatasources:
  - name: PostgreSQL
    orgId: 1

datasources:
  - name: PostgreSQL
    uid: bg-rag-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: bg_rag
    user: user
    secureJsonData:
      password: password
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1700
      timescaledb: false
    isDefault: true
    editable: true
