[project]
name = "bg-rag"
version = "0.1.0"
description = "Baldur's Gate II RAG system for character creation questions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.37.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.50.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=0.25.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bg_rag"]
